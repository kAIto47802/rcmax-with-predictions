name: Type Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install
        run: uv sync --python 3.13 --locked --extra experiments --group check

      - name: Mypy Check
        run: uv run mypy .
