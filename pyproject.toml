[build-system]
requires = ["setuptools >= 61.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcmax"
description = "Learning-Augmented Approximation for Unrelated-Machines Makespan Scheduling"
readme = "README.md"
authors = [{ name = "Kaito Baba", email = "k.ai.to47802@gmail.com" }]
classifiers = [
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development",
]
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]
dynamic = ["version"]

[project.optional-dependencies]
experiments = ["matplotlib>=3.9.4", "ortools>=9.15.6755"]

[dependency-groups]
check = ["mypy", "ruff"]

[tool.setuptools.packages.find]
include = ["rcmax*"]

[tool.setuptools.dynamic]
version = { attr = "rcmax.__version__" }

[tool.ruff]
line-length = 99
target-version = "py39"
exclude = [
  ".eggs",
  ".git",
  ".hg",
  ".ruff_cache",
  ".mypy_cache",
  ".venv",
  "venv",
  "_build",
  "buck-out",
  "build",
  "dist",
  "docs",
  ".asv",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "N", "SIM", "PERF", "RUF"]
ignore = ["N803", "N806"]


[tool.ruff.lint.isort]
lines-after-imports = 2
force-sort-within-sections = true
order-by-type = false

[tool.mypy]
warn_unused_configs = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
strict_equality = true
extra_checks = true
no_implicit_reexport = true

ignore_missing_imports = true
exclude = [".venv", "venv", "^build/"]
